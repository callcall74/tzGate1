<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>차단기 제어</title>
<style>
  :root {
    --bg: #202020;
    --header: #05060f;
    --btn: #000c78;
    --btn-active: #1a2bd0;
    --text: #ffffff;
    --muted: #9aa0b4;
    --ok: #2ecc71;
    --err: #ff5c5c;
    --warn: #f5b942;
    --line: #34363f;
    --input: #2c2e36;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; }

  header {
    background: var(--header);
    border-bottom: 1px solid var(--line);
    padding: 22px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  header h1 {
    flex: 1; margin: 0; font-size: 22px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  header select {
    flex: 1; min-width: 0;
    background: transparent; color: var(--text); border: none;
    font: inherit; font-size: 22px; font-weight: 700; padding: 0;
    appearance: none; -webkit-appearance: none; cursor: pointer;
  }
  header select option { background: var(--header); font-size: 16px; }
  .icon-btn {
    background: none; border: none; color: var(--text); cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: #ffffff22; }
  .icon-btn svg { width: 24px; height: 24px; }

  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 24px 0; font-size: 13px; color: var(--muted);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--err); }
  .dot.wait { background: var(--warn); }

  main { padding: 16px 16px 24px; }
  .group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .group.small { grid-template-columns: 1fr 1fr 1fr; margin-bottom: 16px; }
  .cmd {
    width: 100%; height: 76px;
    background: var(--btn); color: var(--text);
    border: none; border-radius: 6px;
    font: inherit; font-size: 24px; font-weight: 500; letter-spacing: 2px;
    cursor: pointer; user-select: none;
    transition: background .1s, transform .1s;
  }
  .group.small .cmd { height: 48px; font-size: 16px; letter-spacing: 0; }
  .cmd.spaced { letter-spacing: .8em; padding-left: .8em; }
  .cmd:active { background: var(--btn-active); transform: scale(.985); }
  .cmd:disabled { opacity: .45; }

  /* 영상 */
  .video {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  }
  .video iframe, .video img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: contain; }
  .video-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 16px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6;
  }
  .video-msg.play { cursor: pointer; color: #fff; font-size: 15px; background: #00000080; }
  .video-badge {
    position: absolute; top: 8px; right: 8px; padding: 2px 8px; border-radius: 10px;
    background: #000000a0; color: #fff; font-size: 12px;
  }

  .notice {
    margin: 40px 24px; padding: 20px; border: 1px dashed var(--line);
    border-radius: 8px; color: var(--muted); text-align: center; line-height: 1.6;
  }
  .notice button { margin-top: 12px; }

  /* settings */
  .card {
    background: #26282f; border: 1px solid var(--line); border-radius: 8px;
    padding: 16px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 12px; font-size: 15px; color: var(--muted); font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; min-width: 0; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input {
    background: var(--input); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 12px; font: inherit; font-size: 16px;
    width: 100%; min-width: 0;
  }
  .field input:focus { outline: none; border-color: var(--btn-active); }
  .row { display: flex; gap: 10px; }
  .row .field:first-child { flex: 2; }
  .row .field:last-child { flex: 1; }
  .btn {
    background: var(--btn); color: var(--text); border: none; border-radius: 6px;
    padding: 12px 18px; font: inherit; font-size: 15px; cursor: pointer;
  }
  .btn:active { background: var(--btn-active); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }
  .btn.danger { background: transparent; border: 1px solid #5a2a2a; color: var(--err); }
  .btn.block { width: 100%; padding: 16px; font-size: 17px; }
  .card-actions { display: flex; justify-content: flex-end; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 16px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #000000e6; color: #fff; padding: 12px 20px; border-radius: 22px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: all .2s;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #8a1f1fe6; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 제어 화면 ===== -->
  <section id="viewControl">
    <header>
      <h1 id="title">차단기 제어</h1>
      <select id="lotSelect" aria-label="주차장 선택" hidden></select>
      <button class="icon-btn" id="btnSettings" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="status"><span class="dot" id="dot"></span><span id="statusText">연결 대기</span></div>

    <main id="controls">
      <div class="group">
        <button class="cmd spaced" data-cmd="open">열림</button>
        <button class="cmd spaced" data-cmd="close">닫힘</button>
      </div>
      <div class="group small">
        <button class="cmd" data-cmd="lock">열림 고정</button>
        <button class="cmd" data-cmd="unlock">고정 해제</button>
        <button class="cmd" data-cmd="reset">리셋</button>
      </div>
      <div class="video" id="video">
        <img id="videoImg" alt="" hidden>
        <span class="video-badge" id="videoBadge" hidden></span>
        <div class="video-msg" id="videoMsg"></div>
      </div>
    </main>

    <div class="notice" id="emptyNotice" hidden>
      등록된 주차장이 없습니다.<br>설정에서 주차장을 추가해 주세요.<br>
      <button class="btn" id="btnGoSettings">설정으로 이동</button>
    </div>
  </section>

  <!-- ===== 설정 화면 ===== -->
  <section id="viewSettings" hidden>
    <header>
      <button class="icon-btn" id="btnBack" aria-label="뒤로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1>설정</h1>
    </header>
    <main>
      <p class="hint">주차장은 최대 8개까지 저장할 수 있습니다. 저장한 내용은 이 기기(브라우저)에 보관됩니다.</p>
      <div class="card">
        <h3>접속 비밀번호</h3>
        <div class="field">
          <input id="pwInput" type="password" placeholder="비밀번호" autocomplete="current-password">
        </div>
      </div>
      <div id="lotList"></div>
      <button class="btn ghost block" id="btnAdd" style="margin-bottom:14px">+ 주차장 추가</button>
      <button class="btn block" id="btnSave">저장</button>
    </main>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ---- 명령은 이 페이지를 제공한 서버의 /api/send 로 보냄 ----
  // 서버(lib/gate.js)가 비밀번호를 확인한 뒤 주차장 IP:Port 로 UDP 명령을 보냄
  const API_BASE = location.protocol.startsWith('http') ? '' : 'http://localhost:8080'; // 파일로 직접 열었을 때
  const API_URL = API_BASE + '/api/send';
  const VIDEO_URL = API_BASE + '/api/video';

  const CMD_LABEL = { open: '열림', close: '닫힘', lock: '열림 고정', unlock: '고정 해제', reset: '리셋' };
  const MAX_LOTS = 8;
  const KEY_LOTS = 'gate.lots';
  const KEY_CUR  = 'gate.current';
  const KEY_PW   = 'gate.password';

  const $ = (id) => document.getElementById(id);

  // 처음 열었을 때(저장된 주차장 목록이 없을 때) 넣어 두는 기본 주차장
  const DEFAULT_LOTS = [
    { name: '무원마을입1', ip: 'km4593.iptime.org', port: '1102', rtsp: 'rtsp://toozoffice.iptime.org:554/chID=7' },
  ];

  // ---------- 저장소 ----------
  function loadLots() {
    try {
      const saved = localStorage.getItem(KEY_LOTS);
      if (saved === null) return DEFAULT_LOTS.map((l) => ({ ...l }));
      const v = JSON.parse(saved || '[]');
      return Array.isArray(v) ? v.slice(0, MAX_LOTS) : [];
    } catch { return DEFAULT_LOTS.map((l) => ({ ...l })); }
  }
  function saveLots(lots) {
    try { localStorage.setItem(KEY_LOTS, JSON.stringify(lots)); } catch {}
  }
  function loadCur() {
    try { return parseInt(localStorage.getItem(KEY_CUR) || '0', 10) || 0; } catch { return 0; }
  }
  function saveCur(i) {
    try { localStorage.setItem(KEY_CUR, String(i)); } catch {}
  }
  function loadPw() {
    try { return localStorage.getItem(KEY_PW) || ''; } catch { return ''; }
  }
  function savePw(v) {
    try { v ? localStorage.setItem(KEY_PW, v) : localStorage.removeItem(KEY_PW); } catch {}
  }

  let lots = loadLots();
  let cur = Math.min(loadCur(), Math.max(lots.length - 1, 0));
  let password = loadPw();

  // ---------- 토스트 ----------
  let toastTimer;
  function toast(msg, isErr) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- 명령 전송 ----------
  let busy = false;

  function setStatus(state, text) {
    $('dot').className = 'dot ' + state;
    $('statusText').textContent = text;
  }

  async function send(cmd) {
    const lot = lots[cur];
    if (!lot) { toast('주차장을 먼저 설정해 주세요', true); return; }
    if (busy) return;
    if (!password) {
      const p = (window.prompt('접속 비밀번호를 입력하세요') || '').trim();
      if (!p) return;
      password = p;
      savePw(p);
    }
    busy = true;
    const label = `[${lot.name}] ${CMD_LABEL[cmd]}`;
    setStatus('wait', `${label} 전송 중...`);
    if (navigator.vibrate) navigator.vibrate(40);
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, cmd, ip: lot.ip, port: lot.port }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        const msg = data.replied
          ? `${label} 완료${data.reply ? ' - 응답: ' + data.reply : ''}`
          : `${label} 전송함 (응답 없음)`;
        setStatus('on', msg);
        toast(msg);
      } else {
        if (res.status === 401) { password = ''; savePw(''); } // 다음 버튼 때 다시 물어봄
        const msg = `${label} 실패 - ${data.error || '오류 ' + res.status}`;
        setStatus('off', msg);
        toast(msg, true);
      }
    } catch (e) {
      const msg = `${label} 실패 - 네트워크 오류`;
      setStatus('off', msg);
      toast(msg, true);
    } finally {
      busy = false;
    }
  }

  // ---------- 제어 화면 ----------
  function renderControl() {
    const has = lots.length > 0;
    $('controls').hidden = !has;
    $('emptyNotice').hidden = has;

    const sel = $('lotSelect');
    if (lots.length > 1) {
      sel.innerHTML = '';
      lots.forEach((l, i) => {
        const o = document.createElement('option');
        o.value = i;
        o.textContent = `${l.name} 차단기 제어 ▾`;
        sel.appendChild(o);
      });
      sel.value = cur;
      sel.hidden = false;
      $('title').hidden = true;
    } else {
      sel.hidden = true;
      $('title').hidden = false;
      $('title').textContent = has ? `${lots[0].name} 차단기 제어` : '차단기 제어';
    }
    document.title = has ? `${lots[cur].name} 차단기` : '차단기 제어';
    renderVideo();
  }

  // ---------- 영상 ----------
  // rtsp:// 는 서버(/api/video)가 1초에 2장씩 JPEG 로 바꿔 20초 동안 보내줌.
  // 응답은 JPEG 가 이어 붙은 것이므로 끝 표시(FF D9)마다 잘라서 한 장씩 표시.
  // http(s):// 주소(변환 서버의 재생 페이지 등)를 넣으면 그대로 보여줌.
  const VIEW_SECONDS = 20;
  let shownVideo = null;
  let videoAbort = null;

  function videoMessage(text, playable) {
    const msg = $('videoMsg');
    msg.hidden = false;
    msg.textContent = text;
    msg.classList.toggle('play', !!playable);
  }

  function stopVideo() {
    if (videoAbort) { videoAbort.abort(); videoAbort = null; }
    $('videoBadge').hidden = true;
  }

  function showFrame(bytes) {
    const img = $('videoImg');
    const old = img.src;
    img.src = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' }));
    img.hidden = false;
    if (old.startsWith('blob:')) URL.revokeObjectURL(old);
  }

  // end 앞쪽에서 사진 시작(FF D8)의 마지막 위치
  function lastIndexOfSoi(buf, end) {
    for (let i = end - 2; i > 0; i--) {
      if (buf[i - 1] === 0xff && buf[i] === 0xd8) return i - 1;
    }
    return 0;
  }

  async function playVideo() {
    const lot = lots[cur];
    if (!lot || !/^rtsp:\/\//i.test(lot.rtsp || '') || videoAbort) return;
    if (!password) {
      const p = (window.prompt('접속 비밀번호를 입력하세요') || '').trim();
      if (!p) return;
      password = p;
      savePw(p);
    }
    const ctrl = new AbortController();
    videoAbort = ctrl;
    videoMessage('영상 불러오는 중...');
    let frames = 0;
    try {
      const res = await fetch(VIDEO_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, rtsp: lot.rtsp }),
        signal: ctrl.signal,
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { password = ''; savePw(''); }
        throw new Error(data.error || '오류 ' + res.status);
      }
      const reader = res.body.getReader();
      let buf = new Uint8Array(0);
      let startedAt = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        const next = new Uint8Array(buf.length + value.length);
        next.set(buf); next.set(value, buf.length);
        buf = next;
        // 다 받은 사진(FF D9 로 끝남) 중 가장 최근 것을 표시
        let end = -1;
        for (let i = 1; i < buf.length; i++) {
          if (buf[i - 1] === 0xff && buf[i] === 0xd9) end = i + 1;
        }
        if (end > 0) {
          showFrame(buf.slice(lastIndexOfSoi(buf, end), end));
          buf = buf.slice(end);
          if (!frames++) startedAt = Date.now();
          $('videoMsg').hidden = true;
          const left = Math.max(0, VIEW_SECONDS - Math.floor((Date.now() - startedAt) / 1000));
          $('videoBadge').textContent = `실시간 ${left}초`;
          $('videoBadge').hidden = false;
        }
      }
      if (videoAbort !== ctrl) return;
      videoMessage(frames ? '▶ 다시 보기 (20초)' : '영상을 가져오지 못했습니다. 눌러서 다시 시도', true);
    } catch (e) {
      if (videoAbort !== ctrl) return; // 주차장을 바꿔서 중단한 경우
      videoMessage(`영상 실패 - ${e.message === 'Failed to fetch' ? '네트워크 오류' : e.message}. 눌러서 다시 시도`, true);
    } finally {
      if (videoAbort === ctrl) videoAbort = null;
      $('videoBadge').hidden = true;
    }
  }

  function renderVideo() {
    const lot = lots[cur];
    const url = (lot && lot.rtsp) || '';
    $('video').hidden = !lot;
    if (url === shownVideo) return;
    shownVideo = url;
    stopVideo();
    $('video').querySelectorAll('iframe').forEach((f) => f.remove());
    $('videoImg').hidden = true;
    if (!url) {
      videoMessage('영상 주소가 없습니다. 설정에서 RTSP 주소를 넣어 주세요.');
    } else if (/^https?:\/\//i.test(url)) {
      $('videoMsg').hidden = true;
      const f = document.createElement('iframe');
      f.src = url;
      f.allow = 'autoplay; fullscreen';
      $('video').appendChild(f);
    } else if (password) {
      playVideo();
    } else {
      videoMessage('▶ 영상 보기 (20초)', true);
    }
  }

  $('videoMsg').addEventListener('click', () => {
    if ($('videoMsg').classList.contains('play')) playVideo();
  });

  $('lotSelect').addEventListener('change', (e) => {
    cur = parseInt(e.target.value, 10) || 0;
    saveCur(cur);
    renderControl();
  });

  document.querySelectorAll('.cmd').forEach((b) => {
    b.addEventListener('click', () => send(b.dataset.cmd));
  });

  // ---------- 설정 화면 ----------
  let draft = [];

  function lotCard(lot, i) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <h3>주차장 ${i + 1}</h3>
      <div class="field"><label>주차장 이름</label>
        <input data-k="name" placeholder="예) 세명주차장" maxlength="30"></div>
      <div class="row">
        <div class="field"><label>주차장 IP</label>
          <input data-k="ip" placeholder="192.168.0.10 또는 abc.iptime.org" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label>Port</label>
          <input data-k="port" placeholder="5000" inputmode="numeric"></div>
      </div>
      <div class="field"><label>영상 주소 (RTSP, 선택)</label>
        <input data-k="rtsp" placeholder="rtsp://아이디:비번@abc.iptime.org:554/..." inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
      <div class="card-actions"><button class="btn danger" data-del>삭제</button></div>`;
    div.querySelectorAll('input').forEach((inp) => {
      inp.value = lot[inp.dataset.k] || '';
      inp.addEventListener('input', () => { draft[i][inp.dataset.k] = inp.value.trim(); });
    });
    div.querySelector('[data-del]').addEventListener('click', () => {
      draft.splice(i, 1);
      renderSettings();
    });
    return div;
  }

  function renderSettings() {
    const list = $('lotList');
    list.innerHTML = '';
    draft.forEach((l, i) => list.appendChild(lotCard(l, i)));
    $('btnAdd').hidden = draft.length >= MAX_LOTS;
  }

  function openSettings() {
    draft = lots.map((l) => ({ ...l }));
    if (draft.length === 0) draft.push({ name: '', ip: '', port: '', rtsp: '' });
    $('pwInput').value = password;
    renderSettings();
    $('viewControl').hidden = true;
    $('viewSettings').hidden = false;
    window.scrollTo(0, 0);
  }

  function closeSettings() {
    $('viewSettings').hidden = true;
    $('viewControl').hidden = false;
    renderControl();
    window.scrollTo(0, 0);
  }

  $('btnSettings').addEventListener('click', openSettings);
  $('btnGoSettings').addEventListener('click', openSettings);
  $('btnBack').addEventListener('click', closeSettings);
  $('btnAdd').addEventListener('click', () => {
    if (draft.length >= MAX_LOTS) return;
    draft.push({ name: '', ip: '', port: '', rtsp: '' });
    renderSettings();
  });

  $('btnSave').addEventListener('click', () => {
    const cleaned = draft.filter((l) => l.name || l.ip || l.port);
    for (let i = 0; i < cleaned.length; i++) {
      const l = cleaned[i];
      if (!l.name) return toast(`주차장 ${i + 1}: 이름을 입력하세요`, true);
      if (!l.ip) return toast(`${l.name}: IP를 입력하세요`, true);
      const p = Number(l.port);
      if (!Number.isInteger(p) || p < 1 || p > 65535) return toast(`${l.name}: Port는 1~65535`, true);
      if (/[\x00-\x1f]/.test(l.name + l.ip)) return toast(`${l.name}: 사용할 수 없는 문자`, true);
      if (l.rtsp && !/^(rtsp|https?):\/\/\S+$/i.test(l.rtsp)) return toast(`${l.name}: 영상 주소는 rtsp:// 로 시작해야 합니다`, true);
      l.port = String(p);
    }
    lots = cleaned.slice(0, MAX_LOTS);
    saveLots(lots);
    password = $('pwInput').value.trim();
    savePw(password);
    if (cur >= lots.length) { cur = 0; saveCur(0); }
    toast('저장되었습니다');
    closeSettings();
  });

  // ---------- 시작 ----------
  renderControl();
  setStatus('', '준비');
})();
</script>
</body>
</html>
